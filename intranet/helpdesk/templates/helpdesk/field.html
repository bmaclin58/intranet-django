<div{{ field.attrs }}>
    <div class="field-label">
        {{ field.label }}{% if field.required %}<span class="required" aria-hidden="true"> *</span>{% endif %}</div>
    {{ field.input }}
    {% if field.help_text %}
        <div class="field-help">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}
        <div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
